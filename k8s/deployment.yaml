apiVersion: apps/v1
kind: Deployment
metadata:
  name: learningsteps-api
  labels:
    app: learningsteps-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learningsteps-api
  template:
    metadata:
      labels:
        app: learningsteps-api
    spec:
      containers:
        - name: api
          image: acrlearningstepslokiyna78be3.azurecr.io/learningsteps-api:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              DB_USER=$(cat /mnt/secrets-store/db-user)
              DB_PASSWORD=$(cat /mnt/secrets-store/db-password)
              DB_HOST=$(cat /mnt/secrets-store/db-host)
              DB_NAME=$(cat /mnt/secrets-store/db-name)
              export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
              export SECRET_KEY="dev-secret-key"
              export ENVIRONMENT="production"
              echo "Starting API with database host: ${DB_HOST}"
              exec uvicorn main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: learningsteps-kv
