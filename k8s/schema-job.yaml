apiVersion: batch/v1
kind: Job
metadata:
  name: learningsteps-schema-init
  labels:
    app: learningsteps-schema-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: learningsteps-schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: acrlearningstepslokiyna78be3.azurecr.io/learningsteps-api:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export DB_USER=$(cat /mnt/secrets-store/db-user)
              export DB_PASSWORD=$(cat /mnt/secrets-store/db-password)
              export DB_HOST=$(cat /mnt/secrets-store/db-host)
              export DB_NAME=$(cat /mnt/secrets-store/db-name)
              export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
              python /scripts/init_schema.py
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: schema-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: learningsteps-kv
        - name: schema-script
          configMap:
            name: schema-init-script
